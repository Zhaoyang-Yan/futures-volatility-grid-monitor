<div class="mb-3">
  <label class="form-label" for="code{{ task.id if task is defined else 'New' }}">合约代码</label>
  <input
    class="form-control text-uppercase"
    id="code{{ task.id if task is defined else 'New' }}"
    name="code"
    type="text"
    value="{{ task.code if task is defined else '' }}"
    maxlength="32"
    pattern="[A-Za-z0-9_-]+\.[A-Za-z]{2,6}"
    placeholder="CU2608.SHF"
    required
  >
  <div class="form-text task-code-help">
    合约代码请填写完整 iFind 代码，例如：CU2608.SHF、Y2609.DCE、LC2609.GFE。
    不要填写无后缀代码，例如 CU2608。
  </div>
</div>

<div class="row g-3">
  <div class="col-12 col-sm-6">
    <label class="form-label" for="basePrice{{ task.id if task is defined else 'New' }}">基准价格</label>
    <input
      class="form-control"
      id="basePrice{{ task.id if task is defined else 'New' }}"
      name="base_price"
      type="number"
      step="0.01"
      min="0"
      value="{{ task.base_price if task is defined else '' }}"
      required
    >
  </div>
  <div class="col-12 col-sm-6">
    <label class="form-label" for="threshold{{ task.id if task is defined else 'New' }}">报警阈值</label>
    <input
      class="form-control"
      id="threshold{{ task.id if task is defined else 'New' }}"
      name="threshold"
      type="number"
      step="0.01"
      min="0.01"
      value="{{ task.threshold if task is defined else '' }}"
      required
    >
  </div>
</div>

<div class="form-check form-switch mt-3">
  <input
    class="form-check-input"
    id="isActive{{ task.id if task is defined else 'New' }}"
    name="is_active"
    type="checkbox"
    {% if task is not defined or task.is_active %}checked{% endif %}
  >
  <label class="form-check-label" for="isActive{{ task.id if task is defined else 'New' }}">是否启用</label>
</div>
